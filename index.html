<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0810">
  <title>Pour Bubu 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-s="gate">
  <div class="glow"></div><div class="amb a1"></div><div class="amb a2"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="flash" id="flash"></div>

  <main>
    <section class="scene" id="sc-gate" aria-label="Entrée">
      <button class="orb" id="enter" type="button" aria-label="Entrer dans la surprise"><i></i></button>
      <p class="hint">Touche la lumière</p>
    </section>

    <section class="scene" id="sc-reveal">
      <p class="small split">Quelqu'un pense à toi</p>
      <h2 class="big split" data-d="1.3">Bubu</h2>
    </section>

    <section class="scene" id="sc-envelope" aria-label="Une surprise pour Bubu">
      <button class="envelope" id="envelope" type="button" aria-label="Ouvrir l'enveloppe">
        <span class="env-back"></span>
        <span class="env-content"><i class="hrt hrt--sm"></i><strong>Pour Bubu</strong></span>
        <span class="env-front"></span><span class="env-flap"></span>
        <span class="env-seal"><i class="hrt hrt--sm"></i></span>
      </button>
      <p class="hint">Ouvre-la doucement</p>
    </section>

    <section class="scene" id="sc-message" aria-live="polite">
      <div class="chibi-wrap"><div class="chibi"><div class="chibi-jump"><div class="chibi-breathe">
        <span class="chibi-shadow"></span><span class="chibi-limb leg leg--l"></span><span class="chibi-limb leg leg--r"></span>
        <span class="chibi-torso"></span><span class="chibi-belly"></span>
        <span class="heart-hold"><i class="hrt hrt--big"></i><i class="heart-shine"></i></span>
        <span class="chibi-limb arm arm--l"></span><span class="chibi-limb arm arm--r"></span>
        <span class="chibi-head"><span class="ear ear--l"></span><span class="ear ear--r"></span><span class="tuft"></span><span class="eye eye--l"><i></i></span><span class="eye eye--r"><i></i></span><span class="blush blush--l"></span><span class="blush blush--r"></span><span class="mouth"></span></span>
      </div></div></div></div>
      <h1 class="big split" data-d=".8">Joyeux anniversaire Bubu</h1>
      <p class="sub split" data-d="3.2">Je t'aime ❤️</p>
    </section>

    <section class="scene" id="sc-stars" aria-label="Les étoiles de Bubu">
      <p class="small split">Touche chaque étoile</p>
      <div class="sky" id="sky"></div>
      <p class="reason" id="reason" aria-live="polite"></p>
    </section>

    <section class="scene" id="sc-letter" aria-label="Lettre pour Bubu">
      <article class="letter" id="letterCard" tabindex="0">
        <div class="letter-body" id="letterBody"></div>
        <p class="letter-hint" id="letterHint">Touche la lettre pour tout lire</p>
      </article>
    </section>

    <section class="scene" id="sc-finale" aria-live="polite">
      <h2 class="big split" data-d="3.4">Je t'aime Bubu</h2>
      <p class="sub split" data-d="5.2">Aujourd'hui, demain et encore longtemps.</p>
      <p class="sub split" data-d="7.6">Joyeux anniversaire, ma Bubu ❤️</p>
      <p class="hint late">Touche l'écran pour lancer des cœurs</p>
    </section>
  </main>

  <button class="music" id="music" type="button" aria-label="Mettre la musique en pause" aria-pressed="false"><b></b><b></b><b></b></button>
  <button class="replay" id="replay" type="button">Revivre la surprise 💌</button>
  <audio id="bgMusic" preload="auto" loop src="Until%20I%20Found%20You.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
